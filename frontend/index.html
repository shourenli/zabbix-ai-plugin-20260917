<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zabbix AI</title>
<style>
  /* 亮色（默认，对齐 Zabbix 蓝白主题） */
  html[data-theme="light"]{
    --bg:#ffffff; --panel:#f7f8f9; --border:#d9dee3; --text:#1f2c33;
    --muted:#768d99; --accent:#0275b8; --accent-fg:#ffffff;
    --user-bg:#dcecf8; --user-fg:#12384f; --asst-bg:#f4f6f8; --asst-fg:#1f2c33;
    --err-bg:#f8d7da; --err-fg:#7a1c22; --chip-bg:#e6f0f8;
  }
  /* 暗色（对齐 Zabbix dark 主题） */
  html[data-theme="dark"]{
    --bg:#0e1217; --panel:#171d24; --border:#2e3842; --text:#d7dde3;
    --muted:#8b97a3; --accent:#4a9de0; --accent-fg:#0b1015;
    --user-bg:#24425c; --user-fg:#e6f1fa; --asst-bg:#1a2027; --asst-fg:#d7dde3;
    --err-bg:#5a2226; --err-fg:#ffd9dc; --chip-bg:#1f2b36;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;
       font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;font-size:13px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;
         padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
  header h1{font-size:14px;font-weight:600;color:var(--accent)}
  header .actions{display:flex;gap:6px}
  header .actions button{background:none;border:1px solid var(--border);color:var(--muted);
        border-radius:4px;padding:3px 9px;cursor:pointer;font-size:12px}
  header .actions button:hover{color:var(--text);border-color:var(--accent)}
  #chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:8px 11px;border-radius:8px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--user-bg);color:var(--user-fg)}
  .msg.assistant{align-self:flex-start;background:var(--asst-bg);color:var(--asst-fg);border:1px solid var(--border)}
  .msg.error{align-self:flex-start;background:var(--err-bg);color:var(--err-fg);border:1px solid var(--border)}
  .msg .meta{display:block;font-size:11px;color:var(--muted);margin-top:4px}
  #suggest{display:none;flex-wrap:wrap;gap:6px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--border)}
  #suggest button{background:var(--chip-bg);border:1px solid var(--border);color:var(--accent);
        border-radius:12px;padding:3px 10px;font-size:12px;cursor:pointer}
  #suggest button:hover{border-color:var(--accent)}
  /* 键盘高亮项：与鼠标 hover 用同一套视觉 */
  #suggest button.sel,#suggest button.sel:hover{background:var(--accent);border-color:var(--accent);
        color:var(--accent-fg)}
  #inputbar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border);background:var(--panel)}
  #input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
        border-radius:6px;padding:8px 11px;font-size:13px;resize:none;font-family:inherit}
  #input:focus{outline:none;border-color:var(--accent)}
  #send{background:var(--accent);border:none;color:var(--accent-fg);border-radius:6px;
        padding:8px 18px;cursor:pointer;font-size:13px;font-weight:600}
  #send:disabled{opacity:.5;cursor:not-allowed}
  .hint{font-size:11px;color:var(--muted);text-align:center;padding:5px;border-top:1px solid var(--border)}
  .hint b{color:var(--accent);font-weight:600}
  .note{align-self:center;font-size:11px;color:var(--muted);padding:2px 8px;
        border:1px dashed var(--border);border-radius:10px;max-width:95%;text-align:center}
  /* ---- 漂浮球内嵌模式（?embed=bubble）：小框里不需要重复标题，排版收紧凑 ---- */
  html[data-embed="bubble"] header{padding:4px 8px;justify-content:flex-end}
  html[data-embed="bubble"] header h1{display:none}
  html[data-embed="bubble"] #chat{padding:8px;gap:8px}
  html[data-embed="bubble"] .msg{max-width:92%;font-size:12.5px;padding:7px 10px}
  html[data-embed="bubble"] #suggest{padding:6px 8px}
  html[data-embed="bubble"] #inputbar{padding:6px 8px}
  html[data-embed="bubble"] #send{padding:7px 13px}
  html[data-embed="bubble"] .hint{font-size:10px;padding:3px 6px}
  #aboutBox{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;
        align-items:center;justify-content:center;padding:16px;z-index:50}
  #aboutBox[hidden]{display:none}
  #aboutBox .card{background:var(--panel);color:var(--text);border:1px solid var(--border);
        border-radius:8px;padding:16px 18px;max-width:460px;font-size:13px;line-height:1.75}
  #aboutBox h3{font-size:14px;margin-bottom:8px;color:var(--accent)}
  #aboutBox a{color:var(--accent)}
  #aboutBox .dim{color:var(--muted);font-size:12px}
  #aboutBox .card button{margin-top:12px;background:none;border:1px solid var(--border);
        color:var(--muted);border-radius:4px;padding:3px 12px;cursor:pointer;font-size:12px}
  #aboutBox .card button:hover{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Zabbix AI 助手</h1>
  <div class="actions">
    <button id="theme" title="切换主题：跟随 Zabbix / 亮 / 暗">主题：跟随</button>
    <button id="clear">清空会话</button>
<button id="aboutBtn" title="关于本插件与许可证">关于</button>
  </div>
</header>
<div id="chat"></div>
<div id="suggest" role="listbox" aria-label="供应商建议"></div>
<div id="inputbar">
  <textarea id="input" rows="1" placeholder="例：最近有哪些告警？ / db01 磁盘还有几天满？ / 输入 / 可发送问题给供应商"></textarea>
  <button id="send">发送</button>
</div>
<div class="hint" id="hint">斜杠命令：<b>/供应商名 消息内容</b> → 发送到该供应商钉钉群</div>

<div id="aboutBox" hidden>
  <div class="card">
    <h3>Zabbix AI 对话框插件（zabbix-ai-plugin）</h3>
    <div>Copyright (C) 2026 <b>shourenli</b></div>
    <div>许可证：<b>GNU General Public License v3.0</b>（GPL-3.0）</div>
    <div><a id="aboutLicenseLink" href="license" target="_blank" rel="noopener">查看许可证全文</a></div>
    <div class="dim">本程序是自由软件：你可以依据 GPL-3.0 再分发和/或修改它；
      本程序按「现状」提供，不含任何担保。</div>
    <button id="aboutClose">关闭</button>
  </div>
</div>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const clearBtn = document.getElementById('clear');
  const themeBtn = document.getElementById('theme');
  const suggestEl = document.getElementById('suggest');
  const hintEl = document.getElementById('hint');

  let suppliers = [];      // 由 /api/history 返回
  let ttlMinutes = 0;      // 闲置多久算新会话（由后端下发，0=不自动清）
  const THEME_KEY = 'zbxai-theme';

  // ---------- 主题：默认跟随 Zabbix ----------
  function parentThemeClass(){
    // iframe 与 Zabbix 同源时，可读取父页面 body 的主题类（theme-blue / theme-dark / hc-dark ...）
    try {
      if (window.parent && window.parent !== window && window.parent.document) {
        const cls = window.parent.document.body ? window.parent.document.body.className : '';
        if (cls) return cls;
      }
    } catch (e) { /* 跨域或被 sandbox 限制，忽略 */ }
    return '';
  }

  function resolveTheme(mode){
    if (mode === 'light' || mode === 'dark') return mode;
    const cls = parentThemeClass();
    if (/dark/i.test(cls)) return 'dark';
    if (cls) return 'light';
    // 拿不到父页面主题时，退回系统偏好
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  function storeTheme(mode){
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
  }
  function readTheme(){
    try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
  }

  let themeMode = readTheme();
  const params = new URLSearchParams(location.search);
  if (params.get('theme')) themeMode = params.get('theme');

  // 漂浮球内嵌模式：由 launcher.js 以 /ai/?embed=bubble&theme=... 打开
  const embed = params.get('embed');
  if (embed) {
    document.documentElement.setAttribute('data-embed', embed);
    if (embed === 'bubble') {
      inputEl.setAttribute('placeholder', '问点什么…  例：现在有哪些告警？');
    }
  }

  function applyTheme(){
    document.documentElement.setAttribute('data-theme', resolveTheme(themeMode));
    themeBtn.textContent = '主题：' + (themeMode === 'auto' ? '跟随' : themeMode === 'light' ? '亮' : '暗');
  }

  themeBtn.addEventListener('click', () => {
    themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
    storeTheme(themeMode);
    applyTheme();
  });

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', () => { if (themeMode === 'auto') applyTheme(); });
  }
  // Zabbix 切换主题时父页面 class 会变化，做轻量同步
  setInterval(() => { if (themeMode === 'auto') applyTheme(); }, 3000);

  // ---------- 对话 ----------
  function addMsg(role, content, meta){
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = content;
    if(meta){
      const m = document.createElement('span');
      m.className = 'meta';
      m.textContent = meta;
      d.appendChild(m);
    }
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }

  function renderHint(){
    const ttl = ttlMinutes > 0 ? ' ｜ 闲置 ' + ttlMinutes + ' 分钟自动开始新会话' : '';
    if(!suppliers.length){
      hintEl.innerHTML = '斜杠命令：<b>/供应商名 消息内容</b>（当前未配置供应商，请检查 config.yaml）' + ttl;
      return;
    }
    hintEl.innerHTML = '斜杠命令：<b>/供应商名 消息内容</b> ｜ 已配置供应商：' +
      suppliers.map(s => '<b>' + s + '</b>').join('、') + ttl;
  }

  function addNote(text){
    const d = document.createElement('div');
    d.className = 'note';
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
    return d;
  }

  // ---- 斜杠命令建议：键盘优先（↑↓ 选择 / Enter·Tab 补全 / Esc 收起），鼠标点击同样可用 ----
  let suggestItems = [];      // 当前候选（供应商名）
  let suggestIndex = 0;       // 高亮下标

  function commandToken(){
    // 返回"正在输入的供应商名"；已经开始写正文（出现空格）则返回 null
    const v = inputEl.value;
    if(!v.startsWith('/')) return null;
    const rest = v.slice(1);
    return /\s/.test(rest) ? null : rest;
  }

  function updateSuggest(){
    const typed = commandToken();
    if(typed === null){ hideSuggest(); return; }
    const matches = suppliers.filter(s => s.startsWith(typed));
    if(!matches.length){ hideSuggest(); return; }
    // 候选没变就别重建，否则每次按键都会把高亮跳回第一项
    if(suggestItems.length === matches.length && suggestItems.every((n,i)=>n===matches[i])) return;

    suggestItems = matches.slice(0, 10);
    suggestIndex = 0;                       // 默认高亮第一项：直接回车即可选中，无需鼠标
    suggestEl.innerHTML = '';
    suggestItems.forEach((name, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.tabIndex = -1;                      // Tab 留给"补全"，不被按钮抢走焦点
      b.textContent = '/' + name;
      b.setAttribute('role', 'option');
      b.onmouseenter = () => { suggestIndex = i; renderSuggest(); };
      b.onclick = () => completeSuggest(name);
      suggestEl.appendChild(b);
    });
    suggestEl.style.display = 'flex';
    renderSuggest();
  }

  function renderSuggest(){
    Array.from(suggestEl.children).forEach((el, i) => {
      el.classList.toggle('sel', i === suggestIndex);
      el.setAttribute('aria-selected', i === suggestIndex ? 'true' : 'false');
    });
  }

  function completeSuggest(name){
    const pick = name || suggestItems[suggestIndex];
    if(!pick) return;
    inputEl.value = '/' + pick + ' ';
    hideSuggest();
    inputEl.focus();
  }

  function moveSuggest(delta){
    if(!suggestItems.length) return;
    suggestIndex = (suggestIndex + delta + suggestItems.length) % suggestItems.length;
    renderSuggest();
  }

  function suggestOpen(){
    return suggestEl.style.display === 'flex' && suggestItems.length > 0;
  }

  function hideSuggest(){
    suggestEl.style.display = 'none';
    suggestEl.innerHTML = '';
    suggestItems = [];
    suggestIndex = 0;
  }

  async function loadHistory(){
    try{
      const r = await fetch('api/history', {credentials: 'same-origin'});
      if(r.status === 401){
        chatEl.innerHTML = '';
        addMsg('error', '会话已失效，请先登录 Zabbix 后重新打开本页。');
        renderHint();
        return;
      }
      if(!r.ok){
        addMsg('error', '加载会话失败：HTTP ' + r.status);
        return;
      }
      const data = await r.json();
      suppliers = data.suppliers || [];
      ttlMinutes = data.ttl_minutes || 0;
      (data.messages || []).forEach(m => addMsg(m.role, m.content));
      if(data.context_reset){
        addNote('（上一轮对话已闲置超过 ' + ttlMinutes + ' 分钟，已开始新会话）');
      }
      renderHint();
    }catch(e){
      addMsg('error', '初始化失败：' + e);
    }
  }

  async function send(){
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    hideSuggest();
    addMsg('user', text, new Date().toLocaleTimeString());
    sendBtn.disabled = true;
    const busy = addMsg('assistant', '…');
    try{
      const r = await fetch('api/chat', {
        method:'POST',
        credentials: 'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message: text})
      });
      if(r.status === 401){
        busy.textContent = '会话已过期，请先登录 Zabbix。';
        busy.className = 'msg error';
        sendBtn.disabled = false;
        return;
      }
      const data = await r.json();
      if(data.error){
        busy.textContent = data.error;
        busy.className = 'msg error';
      } else {
        busy.textContent = data.reply;
        if(data.context_reset){
          // 服务端把这轮当成了新会话：界面必须跟着清掉，
          // 否则"你看到的"和"模型记得的"会不一致
          chatEl.innerHTML = '';
          addNote('（上一轮对话已闲置超过 ' + (ttlMinutes || 15) + ' 分钟，已开始新会话）');
          addMsg('user', text, new Date().toLocaleTimeString());
          addMsg('assistant', data.reply);
        }
      }
    }catch(e){
      busy.textContent = '网络错误: ' + e;
      busy.className = 'msg error';
    }
    sendBtn.disabled = false;
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('input', updateSuggest);
  inputEl.addEventListener('keydown', e=>{
    if(suggestOpen()){
      // 只有 1 个候选时**不要**劫持方向键：此时"选择"没有意义（下标只会停在 0），
      // 但吞掉它会让光标无法上下移动——输入内容换行时很别扭。
      if((e.key==='ArrowDown' || e.key==='ArrowUp') && suggestItems.length > 1){
        e.preventDefault();
        moveSuggest(e.key==='ArrowDown' ? 1 : -1);
        return;
      }
      if((e.key==='Enter' || e.key==='Tab') && commandToken() !== null){
        // 还在挑供应商（尚未输入空格）→ 补全，而不是发送；
        // 一旦打了空格开始写正文，Enter 就恢复为"发送"
        e.preventDefault();
        completeSuggest();
        return;
      }
    }
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
    if(e.key==='Escape'){ hideSuggest(); }
  });
  clearBtn.addEventListener('click', async ()=>{
    try{
      await fetch('api/chat',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'',clear:true})});
      chatEl.innerHTML='';
      renderHint();
    }catch(e){ addMsg('error', '清空失败：' + e); }
  });

  applyTheme();
  loadHistory();

// ---- 「关于 / 许可证」入口（GPL-3.0 §5(d) 的 Appropriate Legal Notices）----
(function(){
  var box = document.getElementById('aboutBox');
  var openBtn = document.getElementById('aboutBtn');
  var link = document.getElementById('aboutLicenseLink');
  if (!box || !openBtn) { return; }
  // 用当前页面路径拼出 /ai/license，避免部署在子路径或省略末尾斜杠时链错
  if (link) {
    var base = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);
    link.href = base + 'license';
  }
  openBtn.onclick = function(){ box.hidden = false; };
  var closeBtn = document.getElementById('aboutClose');
  if (closeBtn) { closeBtn.onclick = function(){ box.hidden = true; }; }
  box.onclick = function(e){ if (e.target === box) { box.hidden = true; } };
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !box.hidden) { box.hidden = true; }
  });
})();
</script>
</body>
</html>
